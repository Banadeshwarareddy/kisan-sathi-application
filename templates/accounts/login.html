{% extends 'base.html' %}

{% block title %}Login - Kisan Sathi{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-green-50 to-emerald-100 flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-green-800 mb-2">🌾 Kisan Sathi</h1>
                <p class="text-gray-600">Welcome back! Login to your account</p>
            </div>

            <form method="POST" action="{% url 'accounts:login' %}">
                {% csrf_token %}
                <div class="mb-6">
                    <label class="block text-gray-700 font-semibold mb-2">Username</label>
                    <input type="text" name="username" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
                        placeholder="Enter your username">
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 font-semibold mb-2">Password</label>
                    <input type="password" name="password" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
                        placeholder="Enter your password">
                </div>

                <button type="submit"
                    class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition transform hover:scale-105 shadow-lg">
                    Login to Dashboard
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-gray-600">Don't have an account?
                    <a href="{% url 'accounts:signup' %}" class="text-green-600 font-semibold hover:underline">Sign
                        Up</a>
                </p>
                <a href="{% url 'landing' %}" class="text-gray-500 hover:text-gray-700 text-sm mt-2 inline-block">← Back
                    to Home</a>
            </div>
        </div>

        <div class="text-center mt-6 text-gray-600 text-sm bg-white rounded-lg p-4 shadow">
            <p class="font-semibold mb-1">Demo Account:</p>
            <p>Username: <span class="font-mono bg-gray-100 px-2 py-1 rounded">admin</span></p>
            <p>Password: <span class="font-mono bg-gray-100 px-2 py-1 rounded">admin123</span></p>
        </div>
    </div>
</div>
{% endblock %}
