{% extends 'base.html' %}

{% block content %}
<div class="flex h-screen bg-gray-100 overflow-hidden">
    <!-- Mobile overlay -->
    <div id="mobileOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden lg:hidden"></div>

    {% include '_sidebar.html' %}

    <div class="flex-1 flex flex-col overflow-hidden w-full">
        <header class="bg-white shadow-sm px-4 md:px-8 py-4 flex justify-between items-center">
            <!-- Mobile menu button -->
            <button id="mobileMenuBtn" class="lg:hidden text-gray-600 hover:text-green-600 focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                    </path>
                </svg>
            </button>

            <div class="flex-1 ml-4 lg:ml-0">
                <h2 class="text-lg md:text-2xl font-bold text-gray-800">{% block page_title %}Dashboard{% endblock %}</h2>
                <p class="text-sm md:text-base text-gray-600 hidden sm:block">
                    {% block page_subtitle %}Welcome back!{% endblock %}
                </p>
            </div>
            <div class="flex items-center gap-2 md:gap-4">
                <a href="{% url 'landing' %}"
                    class="text-green-600 hover:text-green-700 font-semibold text-sm md:text-base">← Home</a>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-gray-50">
            {% block dashboard_content %}{% endblock %}
        </main>
    </div>
</div>

<script>
    // Mobile menu toggle
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.getElementById('sidebar');
    const mobileOverlay = document.getElementById('mobileOverlay');

    mobileMenuBtn.addEventListener('click', () => {
        sidebar.classList.toggle('-translate-x-full');
        mobileOverlay.classList.toggle('hidden');
    });

    mobileOverlay.addEventListener('click', () => {
        sidebar.classList.add('-translate-x-full');
        mobileOverlay.classList.add('hidden');
    });
</script>
{% endblock %}
